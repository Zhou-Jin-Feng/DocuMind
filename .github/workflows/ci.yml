name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests and retrieval quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Format check
        run: python -m black --check app evaluation tests
      - name: Compile
        run: python -m compileall -q app evaluation tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Run deterministic retrieval evaluation
        run: |
          python -m evaluation.runner \
            --dataset evaluation/datasets/golden_dataset.jsonl \
            --retrieval-mode dense \
            --output-json "${{ runner.temp }}/rag-evaluation/current-evaluation.json" \
            --output-markdown "${{ runner.temp }}/rag-evaluation/current-evaluation.md"
      - name: Enforce retrieval quality regression gate
        run: |
          python -m evaluation.regression_runner \
            --baseline evaluation/baselines/deterministic_dense_v2.json \
            --current "${{ runner.temp }}/rag-evaluation/current-evaluation.json"
      - name: Upload retrieval evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-retrieval-evaluation
          path: |
            ${{ runner.temp }}/rag-evaluation/current-evaluation.json
            ${{ runner.temp }}/rag-evaluation/current-evaluation.md
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: E2E tests
        run: npm run test:e2e

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate full stack compose
        run: docker compose -f compose.yaml config
      - name: Validate Milvus-only compose
        run: docker compose -f infra/milvus/compose.yaml config
